<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#f3efe6"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#1c1814">
    <text x="72" y="84" font-size="18" fill="#b8431f" font-weight="650">01  Problem</text>
    <text x="72" y="140" font-size="36" font-weight="650">The log was manual and unordered</text>
    <text x="72" y="210" font-size="26">Bets lived in a manual log.</text><text x="72" y="252" font-size="26">There was no ordered history per account,</text><text x="72" y="294" font-size="26">and no separate step that scored the next outcome.</text>
  </g>
</svg>
