    <text x="72" y="84" font-size="18" fill="#b8431f" font-weight="650">01  Problem</text>
    <text x="72" y="140" font-size="36" font-weight="650">Which locations recover CAM charges</text>
    <text x="72" y="210" font-size="26">In commercial real estate, common-area charges</text><text x="72" y="252" font-size="26">are not recovered evenly across locations.</text><text x="72" y="294" font-size="26">A score fit on the same year it is judged</text><text x="72" y="336" font-size="26">flatters the result.</text>
