<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#f3efe6"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#1c1814">
    <text x="72" y="84" font-size="18" fill="#b8431f" font-weight="650">01  Problem</text>
    <text x="72" y="140" font-size="36" font-weight="650">The count arrives too late</text>
    <text x="72" y="210" font-size="26">Operators needed a national pending-home-sales figure</text><text x="72" y="252" font-size="26">before the actual count was published.</text><text x="72" y="294" font-size="26">The series turns with the seasons, so a flat guess</text><text x="72" y="336" font-size="26">is wrong even when the level looks close.</text>
  </g>
</svg>
