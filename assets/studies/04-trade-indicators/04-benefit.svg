    <text x="72" y="84" font-size="18" fill="#b8431f" font-weight="650">04  Benefit</text>
    <text x="72" y="140" font-size="36" font-weight="650">No order leaves on its own</text>
    <text x="72" y="210" font-size="26">A failed risk check stops the draft.</text><text x="72" y="252" font-size="26">A finished draft still waits for a person.</text><text x="72" y="294" font-size="26">The workflow has no path that transmits an order.</text>
