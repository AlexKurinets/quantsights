<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#f3efe6"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#1c1814">
    <text x="72" y="84" font-size="18" fill="#b8431f" font-weight="650">04  Benefit</text>
    <text x="72" y="140" font-size="36" font-weight="650">Disagreement does not double-fire</text>
    <text x="72" y="210" font-size="26">The model classifies and stops.</text><text x="72" y="252" font-size="26">If the model and the rules disagree, the rules win.</text><text x="72" y="294" font-size="26">A repeated request does not apply the action twice.</text>
  </g>
</svg>
